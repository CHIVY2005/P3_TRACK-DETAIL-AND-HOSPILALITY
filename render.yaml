# Render Blueprint — backend FastAPI cua Guardian Pricing OS.
# Deploy: Render Dashboard -> New -> Blueprint -> chon repo nay.
services:
  - type: web
    name: guardian-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # SQLite tren dia ephemeral cua Render free: du de demo, nhung
      # DU LIEU RESET khi service restart/redeploy. Doi sang Postgres neu can ben vung.
      - key: USE_SQLITE
        value: "true"
